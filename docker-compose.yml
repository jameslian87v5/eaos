# Minimal platform deployment: API server + agent engine (RUNTIME_MODE=local)
# + persistent SQLite volume + /health probe.
#
# Prereq: create `.env` from `.env.example` and set a strong JWT_SECRET.
# Without JWT_SECRET the container exits on boot (fail-fast, by design).
# For LOCAL DEV ONLY you may instead set ALLOW_DEV_JWT_SECRET=1.
#
# Start:   docker compose up -d --build
# Health:  curl http://localhost:3001/health
# Logs:    docker compose logs -f platform
# Stop:    docker compose down            (keeps the data volume)
# Reset:   docker compose down -v         (DELETES the SQLite volume)
services:
  platform:
    build: .
    image: eaos-platform:latest
    container_name: eaos-platform
    env_file: .env
    environment:
      # Agents run in-process. For agent-per-container mode, set RUNTIME_MODE=docker
      # AND mount the host Docker socket (advanced; not covered by this minimal compose).
      RUNTIME_MODE: local
    ports:
      - "3001:3001"
    volumes:
      - eaos-data:/app/data
      - eaos-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eaos-data:
  eaos-logs:
